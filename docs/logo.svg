<svg xmlns="http://www.w3.org/2000/svg" width="720" height="196" viewBox="0 0 720 196" role="img" aria-label="hexline — a bulletin board system in Go" xml:space="preserve">
  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d787"/>
      <stop offset="1" stop-color="#00afff"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="194" rx="16" fill="#0b0f14" stroke="#21262d" stroke-width="2"/>

  <!-- terminal chrome -->
  <circle cx="30" cy="27" r="5" fill="#ff5f56" opacity="0.9"/>
  <circle cx="50" cy="27" r="5" fill="#ffbd2e" opacity="0.9"/>
  <circle cx="70" cy="27" r="5" fill="#27c93f" opacity="0.9"/>
  <text class="mono" x="92" y="31" font-size="12" fill="#6e7681" font-family="DejaVu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace">sysop@hexline:~</text>
  <text class="mono" x="686" y="31" font-size="12" fill="#484f58" text-anchor="end" font-family="DejaVu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace">node 1</text>

  <!-- wordmark -->
  <text class="mono" x="360" y="121" text-anchor="middle" font-size="68" font-weight="700" letter-spacing="2" font-family="DejaVu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace">
    <tspan fill="#00d787">hex</tspan><tspan fill="#e6edf3">line</tspan>
  </text>
  <rect x="222" y="135" width="276" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text class="mono" x="360" y="161" text-anchor="middle" font-size="11.5" letter-spacing="4" fill="#8b949e" font-family="DejaVu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace">BULLETIN BOARD SYSTEM IN GO</text>

  <!-- prompt -->
  <text class="mono" x="360" y="183" text-anchor="middle" font-size="11" fill="#6e7681" font-family="DejaVu Sans Mono, SFMono-Regular, Menlo, Consolas, monospace">&gt; ssh -p 2222 you@hexline<tspan fill="#ffbd2e">_</tspan></text>
</svg>
